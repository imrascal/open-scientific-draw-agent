name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Inkscape (Linux, best effort)
        if: runner.os == 'Linux'
        continue-on-error: true
        timeout-minutes: 5
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends inkscape
      - name: Install Python deps
        run: python -m pip install --upgrade pip Pillow lxml matplotlib jsonschema
      - name: Test (no Blender, no GPU, no network)
        env:
          PYTHONIOENCODING: utf-8
        run: python -m unittest discover -s tests -v
